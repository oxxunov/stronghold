<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14130f">
<title>Stronghold Mobile — Этап 0</title>
<style>
  :root{
    --stone:#14130f;
    --stone-2:#22201a;
    --iron:#3b3a33;
    --parch:#d9cca9;
    --parch-dim:#8e836a;
    --gold:#c39a3f;
    --blood:#8c3327;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--stone);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--parch);
    user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  #game{display:block;width:100%;height:100%;touch-action:none}

  /* Экран победы или поражения */
  #outcome{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(12,11,9,.82);z-index:30;text-align:center;padding:24px}
  #outcome b{display:block;font-size:30px;color:var(--gold);margin-bottom:10px}
  #outcome span{font-size:15px;color:var(--parch)}

  .panel{position:fixed;background:linear-gradient(180deg,var(--stone-2),#191712);
    border:1px solid var(--iron);border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.6)}

  /* Верхняя строка состояния */
  #topbar{top:0;left:0;right:0;height:44px;border-radius:0;border-left:0;border-right:0;border-top:0;
    display:flex;align-items:center;gap:14px;padding:0 12px;
    overflow-x:auto;scrollbar-width:none;
    padding-top:env(safe-area-inset-top);height:calc(44px + env(safe-area-inset-top));
    font-size:13px;letter-spacing:.3px;z-index:10}
  #topbar b{color:var(--gold);font-weight:600}
  .stat{display:flex;gap:5px;align-items:baseline;white-space:nowrap}
  .stat span{color:var(--parch-dim);font-size:11px;text-transform:uppercase}

  /* Диагностика */
  #diag{top:calc(52px + env(safe-area-inset-top));left:8px;padding:7px 10px;font-size:12px;
    font-family:ui-monospace,"Courier New",monospace;line-height:1.5;min-width:132px;z-index:10}
  #diag .k{color:var(--parch-dim)}
  #fps.bad{color:var(--blood)}
  #fps.ok{color:var(--gold)}

  /* Нижняя панель управления */
  .stat.push{margin-left:auto}
  #topbar::-webkit-scrollbar{display:none}
  .stat{flex:0 0 auto}

  /* Панель строительства */
  #build{left:0;right:0;bottom:60px;bottom:calc(60px + env(safe-area-inset-bottom));
    display:none;flex-direction:column;gap:6px;padding:8px;border-radius:0;
    border-left:0;border-right:0;max-height:46vh;z-index:11}
  #build-cats{display:flex;gap:5px;overflow-x:auto;flex:0 0 auto}
  #build-cats button{padding:8px 12px;font-size:12px;min-height:38px}
  #build-list{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
  .bcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    min-width:132px;padding:9px 11px;text-align:left;line-height:1.3}
  .bcard b{font-size:13px;color:var(--parch)}
  .bcard i{font-style:normal;font-size:11px;color:var(--parch-dim)}
  .bcard s{text-decoration:none;font-size:11px;color:var(--gold)}
  .bcard.poor{opacity:.45}
  .bcard.poor s{color:var(--blood)}

  /* Панель рынка */
  #market{left:0;right:0;bottom:60px;bottom:calc(60px + env(safe-area-inset-bottom));
    display:none;flex-direction:column;gap:4px;padding:8px;border-radius:0;
    border-left:0;border-right:0;max-height:52vh;z-index:11}
  #market-head{display:flex;align-items:center;gap:10px;padding:0 2px 4px}
  #market-head b{color:var(--gold);font-size:14px}
  #market-note{flex:1;font-size:12px}
  #market-note.ok{color:var(--gold)}
  #market-note.bad{color:var(--blood)}
  #market-qty{min-height:34px;padding:6px 12px;font-size:12px}
  #market-list{overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .mrow{display:flex;align-items:center;gap:6px}
  .mname{flex:1;font-size:13px;display:flex;justify-content:space-between;
    padding-right:8px;color:var(--parch)}
  .mname i{font-style:normal;color:var(--parch-dim)}
  .mrow button{min-height:38px;padding:8px 10px;font-size:12px;min-width:104px}
  .mrow button.sell{background:#4a4436;border-color:#5d5643}

  /* Панель казармы — та же раскладка, что у рынка */
  #barracks{left:0;right:0;bottom:60px;bottom:calc(60px + env(safe-area-inset-bottom));
    display:none;flex-direction:column;gap:4px;padding:8px;border-radius:0;
    border-left:0;border-right:0;max-height:52vh;z-index:11}
  #barracks-note{flex:1;font-size:12px}
  #barracks-note.ok{color:var(--gold)}
  #barracks-note.bad{color:var(--blood)}
  #barracks-orders{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px;flex:0 0 auto}
  #barracks-orders button{min-height:36px;padding:7px 11px;font-size:12px;flex:0 0 auto}
  #barracks-list{overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .mreq{font-size:11px;color:var(--parch-dim);min-width:150px;text-align:right;
    padding-right:8px}
  #barracks-list button{min-width:132px}
  #barracks-list button.poor{opacity:.5}

  /* Подтверждение постройки */
  #build-confirm{left:0;right:0;bottom:60px;bottom:calc(60px + env(safe-area-inset-bottom));
    display:none;align-items:center;gap:8px;padding:8px;border-radius:0;
    border-left:0;border-right:0;z-index:12}
  #build-confirm span{flex:1;font-size:13px;padding-left:4px}
  #build-confirm span.ok{color:var(--gold)}
  #build-confirm span.bad{color:var(--blood)}
  button.warn{background:var(--blood);border-color:var(--blood);color:#f4e6e2}
  button.primary{background:var(--gold);color:#1a1509;border-color:var(--gold);font-weight:600}

  #dock{left:0;right:0;bottom:0;border-radius:0;border-left:0;border-right:0;border-bottom:0;
    display:flex;gap:6px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
    overflow-x:auto;z-index:10}
  button{flex:0 0 auto;background:var(--iron);color:var(--parch);border:1px solid #4c4a41;
    border-radius:3px;padding:11px 13px;font-size:13px;font-family:inherit;min-height:44px;
    cursor:pointer;transition:background .12s}
  button:active{background:#565349}
  button.on{background:var(--gold);color:#1a1509;border-color:var(--gold)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .sep{flex:0 0 1px;background:var(--iron);margin:4px 3px}

  /* ---- Лежачий экран: высота дорогая, панели ужимаются ---- */
  @media (orientation:landscape){
    #topbar{height:34px;height:calc(34px + env(safe-area-inset-top));
      gap:10px;padding:0 10px;font-size:12px}
    #topbar .stat span{font-size:10px}

    #diag{top:calc(40px + env(safe-area-inset-top));font-size:11px;
      padding:5px 8px;min-width:112px;line-height:1.35}

    #dock{padding:5px 6px;padding-bottom:calc(5px + env(safe-area-inset-bottom));gap:5px}
    #dock button{min-height:36px;padding:7px 11px;font-size:12px}

    /* панели уезжают вверх меньше и занимают не больше половины высоты */
    #build,#market,#build-confirm{bottom:48px;
      bottom:calc(48px + env(safe-area-inset-bottom))}
    #build{max-height:44vh;padding:6px}
    #build-cats button{min-height:32px;padding:6px 10px;font-size:11px}
    .bcard{min-width:124px;padding:7px 9px}
    #market{max-height:56vh;padding:6px}
    #barracks{max-height:52vh;padding:6px;bottom:48px;bottom:calc(48px + env(safe-area-inset-bottom))}
    .mreq{min-width:120px;font-size:10px}
    .mrow button{min-height:34px;font-size:11px;min-width:96px}
    #build-confirm{padding:6px}
    #build-confirm button{min-height:36px}

    /* в лежачем положении список зданий удобнее в две строки */
    #build-list{flex-wrap:wrap;max-height:28vh;overflow-y:auto}
  }

  /* очень низкий экран — прячем диагностику, она мешает */
  @media (orientation:landscape) and (max-height:400px){
    #diag{display:none}
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="outcome"><div><b id="outcome-title"></b><span id="outcome-text"></span></div></div>

<div id="topbar" class="panel">
  <div class="stat"><span>дерево</span><b id="s-wood">0</b></div>
  <div class="stat"><span>камень</span><b id="s-stone">0</b></div>
  <div class="stat"><span>золото</span><b id="s-gold">0</b></div>
  <div class="stat"><span>народ</span><b id="s-pop">0/0</b></div>
  <div class="stat"><span>еда</span><b id="s-food">0</b></div>
  <div class="stat"><span>народ рад</span><b id="s-pop-mood">50</b></div>
  <div class="stat"><span>лорд</span><b id="s-lord">—</b></div>
  <div class="stat"><span>волна</span><b id="s-wave">—</b></div>
  <div class="stat push"><span id="s-month">Январь</span><b id="s-year">1066</b></div>
</div>

<div id="diag" class="panel">
  <div><span class="k">fps</span> <b id="fps">—</b></div>
  <div><span class="k">юнитов</span> <b id="ents">0</b></div>
  <div><span class="k">путей/с</span> <b id="paths">0</b></div>
  <div><span class="k">зум</span> <b id="zoom">1.00</b></div>
  <div><span class="k">зданий</span> <b id="blds">0</b></div>
  <div><span class="k">рабочих</span> <b id="workers">0</b></div>
  <div><span class="k">войско</span> <b id="army">0</b></div>
  <div><span class="k">свободных</span> <b id="free">0</b></div>
  <div><span class="k">еды на</span> <b id="fooddays">—</b></div>
  <div><span class="k">эль</span> <b id="ale">0%</b></div>
  <div><span class="k">страх</span> <b id="fear">0</b></div>
  <div><span class="k">темп</span> <b id="rate">1.00</b></div>
</div>

<div id="build" class="panel">
  <div id="build-cats"></div>
  <div id="build-list"></div>
</div>

<div id="build-confirm" class="panel">
  <span id="build-reason">—</span>
  <button id="b-cancel">Отмена</button>
  <button id="b-place" class="primary">Поставить</button>
</div>

<div id="market" class="panel">
  <div id="market-head">
    <b>Рынок</b>
    <span id="market-note"></span>
    <button id="market-qty">по 5</button>
  </div>
  <div id="market-list"></div>
</div>

<div id="barracks" class="panel">
  <div id="market-head">
    <b>Казарма</b>
    <span id="barracks-note"></span>
  </div>
  <div id="barracks-orders"></div>
  <div id="barracks-list"></div>
</div>

<div id="dock" class="panel">
  <button id="b-build">Строить</button>
  <button id="b-market">Рынок</button>
  <button id="b-army">Войска</button>
  <button id="b-ration">Паёк: обычный</button>
  <button id="b-tax">Налог: нет</button>
  <button id="b-pause">Пауза</button>
  <button id="b-speed">Скорость ×1</button>
  <div class="sep"></div>
  <button id="b-spawn100">+100 юнитов</button>
  <button id="b-spawn500">+500</button>
  <button id="b-clear">Убрать всех</button>
  <div class="sep"></div>
  <button id="b-grid">Сетка</button>
  <button id="b-center">К центру</button>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
