plugins {
    id 'com.android.application'
}

android {
    namespace 'game.stronghold'
    compileSdk 34

    defaultConfig {
        applicationId "game.stronghold"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // без этого новая версия любой зависимости валит релизную сборку — грабли из Тупика
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// androidx тянет kotlin-stdlib 1.8.22, а часть библиотек — старые
// kotlin-stdlib-jdk7/jdk8 1.6.21; классы задваиваются и сборка падает
// на checkDebugDuplicateClasses. BOM приводит всё к одной версии.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
